name: Ofertiva AI - vídeos e ofertas
on:
  schedule:
    - cron: "5 12,18,0 * * *"
  workflow_dispatch:
  push:
    branches: [feat/ofertiva-ai]
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  produzir:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && contains(github.event.issue.body, 'ofertiva'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - name: Preparar FFmpeg, fonte e bibliotecas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r automation/requirements.txt
      - name: Testes de regras e links
        run: python -m unittest discover -s automation -p "test_*.py"
      - name: Compilar painel Next.js
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Descobrir, criar vídeo e distribuir
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            python automation/worker.py --issue
          else
            python automation/worker.py
          fi
      - name: Disponibilizar vídeo e relatório
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ofertiva-video-${{ github.run_id }}
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 7
      - name: Evitar postagens repetidas
        if: github.event_name != 'issues'
        run: |
          if git diff --quiet -- data/posted.json; then
            echo "Sem novos envios"
          else
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add data/posted.json
            git commit -m "chore: registrar ofertas enviadas"
            git push
          fi
